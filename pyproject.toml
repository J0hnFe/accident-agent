[project]
name = "accident-agent"
version = "0.1.0"
description = "Orquestador multiagente con RAG sobre Neo4j para siniestros de transito del Ecuador"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "neo4j==6.4.1",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "rich==15.0.0",
    "structlog==26.1.0",
    "typer==0.27.3",
    "tzdata==2026.6",
    "uvicorn==0.54.0",
]

[project.scripts]
accident-agent = "accident_agent.interfaces.cli:app"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Solo versiones publicadas hace al menos dos semanas (seccion 12 del plan).
exclude-newer = "2026-11-01T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration and not e2e'"
markers = [
    "integration: requiere Neo4j levantado con docker compose",
    "e2e: escenarios de punta a punta del orquestador",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.17.3",
]
